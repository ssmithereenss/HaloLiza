<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" type="image/png" href="img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/style.css">
  <title>Untuk Liza 💌</title>
</head>

<body>
  <div class="login_container">
    <h2>Hi 👋🏼 Liza, login dulu yuk</h2>
    <form id="loginForm" class="login_form">
      <input type="text" id="username" placeholder="Username" aria-label="Username" autocomplete="off" autocapitalize="none" />
      <input type="password" id="password" placeholder="Password" aria-label="Password" autocomplete="off" />
      <button type="submit" id="loginBtn">Login</button>
      <p class="login_description">Hint: username &amp; password-nya nama kamu, huruf kecil semua 😉</p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./scripts/index.js"></script>
</body>

</html>
